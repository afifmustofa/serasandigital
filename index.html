<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Serasan Digital</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

<main class="login">
  <section class="login__card" aria-labelledby="loginTitle">
    <div class="login__brand">
      <img src="assets/img/mark-96.png" srcset="assets/img/mark-96.png 1x, assets/img/mark-160.png 2x" alt="" width="40" height="40">
      <span>Serasan Digital</span>
    </div>

    <h1 id="loginTitle">Masuk ke sistem</h1>
    <p class="login__lead">Silakan masukkan nama pengguna dan kata sandi Anda.</p>

    <form id="loginForm" class="login__form" novalidate>
      <div class="field">
        <label for="username">Nama pengguna</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Kata sandi</label>
        <div class="field__pw">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="field__toggle" id="pwToggle" aria-label="Tampilkan kata sandi" aria-pressed="false">Lihat</button>
        </div>
      </div>

      <label class="check">
        <input type="checkbox" name="remember"> Ingat saya
      </label>

      <p class="login__msg" id="loginMsg" role="alert" hidden></p>

      <button type="submit" class="btn">Masuk</button>
    </form>
  </section>

  <p class="login__foot">&copy; <span id="year">2026</span> Serasan Digital</p>
</main>

<script src="assets/js/login.js"></script>
</body>
</html>
